<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="1024" height="576"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
  const stream = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  const chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const reader = new FileReader();
    reader.onload = () => {
      console.log('VIDEO_BASE64:' + btoa(reader.result));
    };
    reader.readAsBinaryString(blob);
  };

  recorder.start();
  let frame = 0;
  const anim = () => {
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Pan & zoom animation across mural painting
    const scale = 1 + Math.sin(frame * 0.03) * 0.06;
    const offsetX = Math.cos(frame * 0.02) * 20;
    const offsetY = Math.sin(frame * 0.02) * 12;

    ctx.save();
    ctx.translate(canvas.width/2 + offsetX, canvas.height/2 + offsetY);
    ctx.scale(scale, scale);
    ctx.drawImage(img, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
    ctx.restore();

    // Shimmering Golden Lighting Wave over Mural Scene
    const waveX = (Math.sin(frame * 0.04) * 0.5 + 0.5) * canvas.width;
    const grad = ctx.createRadialGradient(waveX, canvas.height * 0.4, 20, waveX, canvas.height * 0.4, 400);
    grad.addColorStop(0, 'rgba(255, 230, 170, 0.4)');
    grad.addColorStop(0.5, 'rgba(205, 164, 94, 0.15)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (frame < 180) {
      requestAnimationFrame(anim);
    } else {
      recorder.stop();
    }
  };
  anim();
};
img.src = 'hero-m-bg.jpg';
</script>
</body>
</html>
