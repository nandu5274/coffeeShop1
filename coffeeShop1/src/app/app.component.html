<div class="main-container">

  <!--  below code is for popups -->

  <div *ngIf="showModal" class="modal">
    <div class="modal-content">
      <button (click)="closeModal()" style="width: 9em; background: #5c2120;
      align-self: center;     position: fixed;" class=" pop-up-btm">close</button>

      <div class="test" style=" height: 86vh;
      padding: 2em;
      
      overflow-y: auto;">
        <div style="text-align: center; display: flex; justify-content: center; align-items: center; min-height: 70vh;">
          <img [src]="imageUrl" alt="Responsive Image" class="imag-size">
        </div>


      </div>

    </div>
  </div>


  <!--  above code is for popups -->

  <div *ngIf="showVersionModal" class="modal">




    <div class="modal-content" *ngIf="reloadCount>=1">
      <div style="    background-color: #cda45e;
          color: #1a1814;
          padding: 15px;
          border: 1px solid #f2dede;
          border-radius: 4px;
          align-items: center;
          align-self:center;
          z-index: 99999999;
          width: fit-content;">
        close the browser tab and Re-scan
      </div>

    </div>
  </div>


  <div class="container" #container style="z-index:999;max-height: 1em;">


    <!-- <div class="heart" *ngFor="let heart of hearts; let i = index" [style.left.px]="heart.left" [style.animation-duration.s]="heart.duration"></div> -->
  </div>



  <app-nav-bar *ngIf="!hideMarketingShell"></app-nav-bar>
  <!-- floating-bell.component.html -->
  <div class="floating-bell" *ngIf="!hideCallWaiter" (click)="openFloatingBellPopup()">
    <i class="fas fa-concierge-bell"></i>
    <span class="call-waiter-box">
      Call Waiter
    </span>
  </div>


  <!-- Popup Content -->
  <div class="notification-popup" *ngIf="isPopupOpen && !hideCallWaiter">
    <div class="popup-container">
      <h3>Choose Floor & Table to Call Waiter</h3>

      <!-- Dropdown for Floor Selection -->
      <label class="popup-label" for="floor">Floor:</label>
      <select class="popup-select" id="floor" [(ngModel)]="selectedFloor">
        <option *ngFor="let floor of floors" [value]="floor">{{ floor }}</option>
      </select>

      <!-- Input for Table Number -->
      <label class="popup-label" for="tableNumber">Table Number:</label>
      <input class="popup-input" id="tableNumber" type="number" [(ngModel)]="tableNumber" placeholder="Enter Table Number" />

      <!-- Input for message  -->
      <label class="popup-label" for="message">Message (optional):</label>
      <input class="popup-input" id="message" type="text" [(ngModel)]="message" placeholder="e.g. Need extra water" />


      <!-- Button section -->
      <div class="popup-button-group">
        <button class="popup-btn" [disabled]="!selectedFloor || !tableNumber" (click)="submitDetails()">Submit</button>
        <button class="popup-btn" (click)="closePopup()">Close</button>
      </div>
    </div>
  </div>
  <router-outlet></router-outlet>

  <app-delivery-bottom-nav *ngIf="!hideMarketingShell"></app-delivery-bottom-nav>

  <app-footer *ngIf="!hideMarketingShell"></app-footer>



</div>
