<div *ngIf="showSpinner" class="spinner-overlay">
  <div class="spinner"></div>
</div>

<div *ngIf="showPaidSpinner" class="spinner-overlay">
  <div class="spinner"></div>
</div>
<!-- Admin Security Gate Modal Overlay (Shown when user is not logged in) -->
<div class="admin-login-overlay" *ngIf="!isAuthenticated">
  <div class="admin-login-card glass-card">
    <div class="login-header">
      <div class="lock-icon-badge">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2 class="login-title">Admin Portal Login</h2>
      <p class="login-subtitle">
        Access to administrative financial ledgers & system controls is restricted. Enter Admin Password to proceed.
      </p>
    </div>

    <!-- Error Banner -->
    <div class="login-alert error" *ngIf="loginErrorMsg">
      <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ loginErrorMsg }}
    </div>

    <form (submit)="verifyAndLogin(); $event.preventDefault()" class="login-form">
      <div class="form-group">
        <label for="adminPasswordInput" class="form-label">ENTER ADMIN PASSWORD</label>
        <div class="input-icon-wrap">
          <i class="bi bi-key-fill field-icon"></i>
          <input 
            type="password" 
            id="adminPasswordInput" 
            name="adminPasswordInput" 
            [(ngModel)]="passwordInput" 
            placeholder="Enter Password" 
            autocomplete="off" 
            class="login-input" 
            autofocus />
        </div>
      </div>

      <div class="login-actions">
        <button type="submit" class="btn-verify-access">
          <i class="bi bi-unlock-fill"></i> Login
        </button>
      </div>
    </form>

    <div class="login-footer">
      <a routerLink="/" class="back-home-link">
        <i class="bi bi-arrow-left"></i> Back to Homepage
      </a>
    </div>
  </div>
</div>

<div *ngIf="isAuthenticated">

  <section id="menu" class="menu section-bg" style="padding-top: 9em;">


    
    <div style="display: flex; justify-content: flex-end; padding: 0 20px 10px 20px;">
      <button class="lock-admin-top-btn" (click)="lockAdminPage()" title="Lock Admin Portal" style="display: flex; align-items: center; gap: 6px; cursor: pointer; background: rgba(220, 53, 69, 0.18); border: 1px solid rgba(220, 53, 69, 0.5); color: #ff6b6b; border-radius: 20px; padding: 6px 16px; font-size: 13px; font-weight: 600; transition: all 0.2s ease;">
        <i class="bi bi-lock-fill"></i> Lock Admin
      </button>
    </div>

    <div class="tabs" [class.sticky-tabs]="isSticky">

      <div class="tab tab-btn " (click)="selectTab('inventory')" [class.active]="selectedTab === 'inventory'">Inventory
      </div>

      <div class="tab tab-btn " (click)="selectTab('links')" [class.active]="selectedTab === 'links'">links
      </div>
    </div>


    <div class="tab-content">
      <div *ngIf="selectedTab === 'inventory'">

        <div class="buttons" style="margin: 0px; padding: 3px 9px 0px 16px;">
          <button style=" background-color: #d49b3b; color: #11100e;"  (click)="approveLogin()" >approve login</button>
               <button style=" background-color: #d49b3b; color: #11100e;"  (click)="trigger('n')" >tk </button>
                 <button style=" background-color: #d49b3b; color: #11100e;"  (click)="trigger('y')" >ty</button>
          <button style=" background-color: #d49b3b; color: #11100e;"  (click) = "revokeLogin()" >revoke login</button>
         
        </div>


      </div>

      <!-- System Links Tab -->
      <div *ngIf="selectedTab === 'links'" class="system-links-tab">
        <div class="container" data-aos="fade-up">
          <div class="section-title" style="padding-top: 1em; padding-bottom: 0px;">
            <h2>System Links</h2>
          </div>

          <!-- Controls: Category Filter & Search Bar -->
          <div class="links-controls-bar">
            <div class="category-pills-group">
              <button 
                class="pill-btn" 
                [class.active]="activeLinkCategory === 'all'" 
                (click)="activeLinkCategory = 'all'">
                All ({{ systemLinks.length }})
              </button>

              <button 
                class="pill-btn" 
                [class.active]="activeLinkCategory === 'staff'" 
                (click)="activeLinkCategory = 'staff'">
                Staff & Ops
              </button>

              <button 
                class="pill-btn" 
                [class.active]="activeLinkCategory === 'store'" 
                (click)="activeLinkCategory = 'store'">
                Storefront
              </button>

              <button 
                class="pill-btn" 
                [class.active]="activeLinkCategory === 'analytics'" 
                (click)="activeLinkCategory = 'analytics'">
                Analytics & Tools
              </button>
            </div>

            <div class="links-search-input">
              <i class="bi bi-search field-icon"></i>
              <input 
                type="text" 
                placeholder="Search links..." 
                [(ngModel)]="linkSearchQuery" />
            </div>
          </div>

          <!-- Compact Form Cards Grid -->
          <div class="system-links-grid compact-grid">
            <div 
              class="link-form-card compact-card glass-card" 
              *ngFor="let link of filteredSystemLinks">
              
              <div class="card-main-content">
                <div class="link-icon-box small">
                  <i class="bi {{ link.icon }}"></i>
                </div>

                <div class="link-info">
                  <div class="title-row">
                    <h4 class="link-title">{{ link.title }}</h4>
                    <span class="category-badge" [ngClass]="link.badgeClass || 'badge-primary'">
                      {{ link.badge }}
                    </span>
                  </div>
                  <code class="link-path-badge">{{ link.path }}</code>
                </div>
              </div>

              <div class="card-actions-row compact-actions">
                <a 
                  [routerLink]="link.path" 
                  class="btn-open-link sm" 
                  target="_blank"
                  title="Open Page">
                  <i class="bi bi-box-arrow-up-right me-1"></i> Open
                </a>

                <button 
                  class="btn-copy-link sm" 
                  (click)="copyLinkUrl(link.path)"
                  [title]="copiedLinkPath === link.path ? 'Copied URL!' : 'Copy Link URL'">
                  <i class="bi" [class.bi-check-lg]="copiedLinkPath === link.path" [class.bi-clipboard]="copiedLinkPath !== link.path"></i>
                  <span>{{ copiedLinkPath === link.path ? 'Copied' : 'Copy' }}</span>
                </button>
              </div>

            </div>
          </div>

          <!-- Empty Search State -->
          <div class="empty-links-state" *ngIf="filteredSystemLinks.length === 0">
            <i class="bi bi-search empty-icon"></i>
            <h3>No links match your search</h3>
          </div>
        </div>
      </div>

    </div>




  </section>

</div>
