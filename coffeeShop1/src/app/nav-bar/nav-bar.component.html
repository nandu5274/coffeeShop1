     <!-- <a (click)="openCustomerLoginModal()" class="book-a-table-btn "> Login</a> -->



     <div class="d-flex align-items-center" *ngIf="!diable_login_btn">
      <!-- Displayed when user is not logged in -->
      <a *ngIf="!isLoggedIn" (click)="openCustomerLoginModal()" class="book-a-table-btn">
        Login
      </a>
    
      <!-- Displayed when user is logged in -->
      <div *ngIf="isLoggedIn" class="user-dropdown">
        <div class="user-initial" (click)="toggleDropdown()">
          {{ userInitial }}
        </div>
        <div *ngIf="isDropdownOpen" class="customer-dropdown-menu">
         
          <a style="    font-weight: bold;">{{customerName}}</a>
          <hr class="dropdown-divider">
          <a (click)="navigateToProfile()">Profile</a>
          <a (click)="onSignOut()">Sign Out</a>
        </div>
      </div>
      </div>

      <!-- Settings Floating Dropdown -->
      <div class="settings-dropdown floating-settings">
        <button class="settings-btn" (click)="toggleSettingsDropdown($event)" aria-label="Settings">
          <i class="bi bi-gear-fill"></i>
        </button>
        <div *ngIf="isSettingsOpen" class="settings-menu glass-panel">
          <div class="settings-header">
            <h6>Settings</h6>
          </div>
          <hr class="dropdown-divider">
          
          <!-- Font Size Slider -->
          <div class="settings-item">
            <div class="settings-label-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; width: 100%;">
              <label for="fontSizeRange" class="settings-label" style="margin: 0; display: flex; align-items: center; justify-content: space-between; flex: 1;">
                <span>Font Size</span>
                <span class="value-badge">{{ fontSizePercent }}%</span>
              </label>
              <button class="reset-link-btn" (click)="resetFontSize($event)" style="background: none; border: none; color: #cda45e; font-size: 0.75rem; cursor: pointer; padding: 0 0 0 8px; text-decoration: underline; outline: none; font-weight: 600;">Reset</button>
            </div>
            <div class="slider-container">
              <i class="bi bi-type" style="font-size: 0.85rem;" title="Decrease text size"></i>
              <input 
                type="range" 
                id="fontSizeRange" 
                min="80" 
                max="140" 
                step="5" 
                [value]="fontSizePercent" 
                (input)="onFontSizeChange($event)"
                class="form-range custom-slider"
              />
              <i class="bi bi-type" style="font-size: 1.3rem;" title="Increase text size"></i>
            </div>
          </div>
        </div>
      </div>
     <a href="#book-a-table" class="book-a-table-btn scrollto d-none d-lg-flex"> Book a table</a>
     
    </div>



    <div [class.show]="showModal" class="backdrop" (click)="toggleModal(); $event.stopPropagation()"></div>
    
    <div [class.show]="showModal" class="right-modal">
      <div class="cart-header">
        <a class = "cart-header-title">Cart</a>
        <a (click)="toggleModal(); $event.stopPropagation()" class="prepare-btn cart-close-btn" > X </a>
      </div>
    
        <app-items-cart (cartDataListCount)="updateCartCount($event)" (closeCartModal)="toggleModal()" (orderProcessingStatus) = "captureOrderProcessingStatus($event)" (orderingResponse) = "captureOrderProcessingResponse($event)"> </app-items-cart>
    </div>

    <app-booking-order  [orderProcessingStatus]="orderProcessingStatus" [response] = "response"></app-booking-order>
  </header><!-- End Header -->

  <!-- Info Alert Message -->
  <div *ngIf="infoMessage" >
    <div *ngFor="let message of infoMessages; let i = index" class="alert info" >
      <span>{{ message }}</span>
      <button (click)="closeInfoMessage(i)">×</button>
    </div>
  </div>

  <!-- Button to Trigger Info Alert -->

  align-self: center;  " class=" pop-up-btm">close</button>

  </div>
</div>
