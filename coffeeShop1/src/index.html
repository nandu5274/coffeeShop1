<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <!-- Allow browser/CDN caching — previous no-cache forced full re-download every visit -->
  <meta http-equiv="Cache-Control" content="public, max-age=3600">
  <title>Cafe Kubera</title>
  <meta name="description" content="Cafe Kubera — menu, orders, and wall AR">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://kuber-backup.onrender.com">

  <link href="assets/img/logo.png" rel="icon">
  <link href="assets/img/logo.png" rel="apple-touch-icon">

  <!-- One font family stack + one FA CSS (was duplicated 4–5 times) -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" crossorigin="anonymous" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></noscript>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Critical template CSS only; defer heavier vendors -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/vendor/animate.css/animate.min.css" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" media="print" onload="this.media='all'">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1814">

  <script>
    if (typeof global === 'undefined') { var global = window; }
    // Chrome blocks Permissions-Policy "unload". SockJS still registers unload
    // for cleanup — remap to pagehide so captain WS works without console spam.
    (function () {
      var proto = EventTarget && EventTarget.prototype;
      if (!proto || proto.__kuberaUnloadRemap) return;
      var origAdd = proto.addEventListener;
      var origRemove = proto.removeEventListener;
      proto.addEventListener = function (type, listener, options) {
        if (type === 'unload') type = 'pagehide';
        return origAdd.call(this, type, listener, options);
      };
      proto.removeEventListener = function (type, listener, options) {
        if (type === 'unload') type = 'pagehide';
        return origRemove.call(this, type, listener, options);
      };
      proto.__kuberaUnloadRemap = true;
    })();
  </script>
</head>
<body>
  <app-root></app-root>

  <!-- Defer non-critical vendor JS (was blocking first paint) -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script src="assets/vendor/aos/aos.js" defer></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js" defer></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js" defer></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js" defer></script>
  <!-- main.js is loaded by AppComponent when needed — avoid double load -->

  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
